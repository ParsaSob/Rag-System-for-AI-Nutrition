[theme]
primaryColor = "#FF4B4B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[server]
port = 8080
address = "0.0.0.0"
headless = true
enableXsrfProtection = false
enableCORS = true

[browser]
gatherUsageStats = false

[runner]
fastRerenderThreshold = 1000 